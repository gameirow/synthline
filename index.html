function sub(s,held,edge,L){
 s.t+=H;if(edge)s.buf=.1;s.buf-=H;

 if(s.y>CEIL-.6){s.y=CEIL-.6;s.vy=Math.min(s.vy,0);if(s.g<0)s.gr=1}
 while(s.i<L.length&&L[s.i].x+(L[s.i].w||1)<s.x-1)s.i++;
 for(let j=s.i;j<L.length&&L[j].x<s.x+1.5;j++){const o=L[j];
  if(o.t=='b'||o.t=='h'){const y0=o.t=='b'?0:CEIL-o.h,y1=o.t=='b'?o.h:CEIL;if(s.x+.75>o.x+.25&&s.x+.25<o.x+.75&&s.y+.55>y0&&s.y+.05<y1){s.dead=1;return}}
  else if(o.t=='p'){if(s.x+.8>o.x&&s.x+.2<o.x+o.w){
    if(s.g>0&&s.vy<=0&&py>=o.y-.02&&s.y<o.y){s.y=o.y;s.vy=0;s.gr=1}

  else if(o.t=='e'){if(s.buf>0&&Math.abs(s.x-o.x)<.9&&Math.abs(s.y+.3-o.y)<.9){s.vy=J*s.g;s.gr=0;s.buf=0;s.u.add(j);s.ev='e'}}

function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;Hh=innerHeight;c.width=W*D|0;c.height=Hh*D|0;BC.width=c.width>>2;BC.height=c.height>>2;U=Math.min(Hh/10,W/15);GY=Hh/2+3*U;

{const n=document.createElement('canvas');n.width=n.height=128;const g=n.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);grain=X.createPattern(n,'repeat')}
rs();addEventListener('resize',rs);
// ---------------- audio ----------------
let AC=null,NB,AN,wave,run=null,mStart=0,ni=0,lvl=0;
const clk=()=>AC?AC.currentTime:performance.now()/1000,songNow=()=>clk()-mStart,lat=()=>AC?(AC.outputLatency||0)+(AC.baseLatency||0):0;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 AN=AC.createAnalyser();AN.fftSize=2048;wave=new Float32Array(AN.fftSize);const cp=AC.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;AN.connect(cp);cp.connect(AC.destination)}catch(e){AC=null}}
function newRun(){if(!AC)return;if(run){const b=run.bus;b.gain.setTargetAtTime(0,AC.currentTime,.03);setTimeout(()=>b.disconnect(),600)}
 const bus=AC.createGain();bus.gain.value=.85;bus.connect(AN);const g=v=>{const n=AC.createGain();n.gain.value=v;n.connect(bus);return n};
 const lead=g(0),dl=AC.createDelay(1),fb=AC.createGain(),lf=AC.createBiquadFilter();dl.delayTime.value=SPB*.75;fb.gain.value=.4;lf.type='lowpass';lf.frequency.value=2400;lead.connect(dl);dl.connect(lf);lf.connect(fb);fb.connect(dl);lf.connect(bus);
 run={bus,base:g(1),drums:g(0),bass:g(0),lead,sfx:g(.9)};lead.disconnect();lead.connect(bus);lead.connect(dl);setLayers(lvl,1)}
function setLayers(l,now){if(!run)return;[['drums',1],['bass',2],['lead',3]].forEach(([k,n])=>run[k].gain.setTargetAtTime(l>=n?1:0,AC.currentTime,now?.01:.18))}
function osc(t,f,d,type,v,dest,o={}){const n=AC.createOscillator(),g=AC.createGain();n.type=type;n.frequency.setValueAtTime(f,t);if(o.det)n.detune.value=o.det;if(o.f2)n.frequency.exponentialRampToValueAtTime(o.f2,t+d*.6);
 const a=o.a||.003;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0004,t+d);let x=n;
 if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.Q.value=o.q||1;fl.frequency.setValueAtTime(o.lp,t);if(o.sw)fl.frequency.exponentialRampToValueAtTime(o.lp*.22,t+d);x=n.connect(fl)}
 x.connect(g).connect(dest);n.start(t);n.stop(t+d+.05)}
function noise(t,d,v,hp,dest){const b=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();b.buffer=NB;b.playbackRate.value=rnd(.9,1.1);f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0004,t+d);b.connect(f).connect(g).connect(dest);b.start(t,rnd(0,.5));b.stop(t+d+.02)}
const inZone=x=>Z.some(z=>x>=z[0]&&x<z[1]),chord=t=>{const ch=Math.floor(t/(SPB*4))%4;return{R:[45,41,48,43][ch],Q:ch==0?[0,3,7,12]:[0,4,7,12]}};
function note(i,t){if(i*ST*V>END+40)return;const st=i%16,bar=i>>4,{R,Q}=chord(i*ST+1e-4);
 if(inZone(i*ST*V)){if(st%4==0)osc(t,1760,.04,'square',.04,run.base);return}
 if(st%4==0)osc(t,145,.34,'sine',1,run.base,{f2:40});
 if(st==0)for(const n of Q.slice(0,3))for(const det of [-9,9])osc(t,mf(R+12+n),SPB*4.2,'sawtooth',.02,run.base,{lp:1300,a:.35,det});
 if(st%2==1)noise(t,.035,.1,8500,run.drums);if(st%4==2)noise(t,.14,.06,6500,run.drums);
 if(st==4||st==12){noise(t,.22,.32,1100,run.drums);osc(t,200,.13,'triangle',.28,run.drums,{f2:120})}
 if([0,3,6,8,10,11,14].includes(st))osc(t,mf(R-12+(st==6||st==14?12:0)),ST*1.7,'sawtooth',.3,run.bass,{lp:1500,sw:1,q:6});
 osc(t,mf(R+24+Q[[0,1,2,3,2,1,2,3][st%8]]),ST*.85,'square',.045,run.lead,{lp:3400});
 if(st==8&&bar%2)osc(t,mf(R+36+Q[2]),SPB*1.5,'triangle',.07,run.lead)}
function pluck(kind,t){if(!AC||!run)return;const{R,Q}=chord(t),n=AC.currentTime,f=mf(R+36+Q[Math.random()*4|0]);
 if(kind=='OFF')osc(n,mf(R+24),.18,'square',.05,run.sfx,{lp:600});else{osc(n,f,kind=='PERFECT'?.5:.3,'triangle',kind=='PERFECT'?.16:.09,run.sfx);if(kind=='PERFECT')osc(n,f*2,.3,'sine',.05,run.sfx)}}
function fx(f,d,type,v,f2){if(AC&&run)osc(AC.currentTime,f,d,type,v,run.sfx,{f2})}
// ---------------- game state ----------------
let best='';try{best=localStorage.synthRank||''}catch(e){}
let s=null,mode='menu',held=0,edge=0,lastPress=-9,pg=1,camX=0,tr=[],parts=[],rings=[],texts=[],rip=[],shake=0,flash=0,glitch=0,deadT=0,resT=0,cpI=0;
let score=0,combo=0,maxC=0,perf=0,good=0,offc=0,deaths=0,cpSnap=null;
$('bestr').textContent=best?'BEST RANK  '+best:'';
{const p=$('prog');CPS.slice(1).forEach(x=>{const m=document.createElement('s');m.style.left=(x/END*100)+'%';p.appendChild(m)})}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('h');clearTimeout(toast.k);toast.k=setTimeout(()=>e.classList.add('h'),1300)}
function burst(x,y,n,sp,col,life=.8){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.15,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:rnd(.4,1)*life,c:col})}}
function setCombo(n){combo=n;maxC=Math.max(maxC,n);const l=n>=24?3:n>=12?2:n>=4?1:0;if(l!=lvl){if(l>lvl&&mode=='play')toast(['','DRUMS IN','BASS IN','LEAD IN'][l]);lvl=l;setLayers(l)}}
function begin(cp){s=mk(cp);pg=1;mStart=clk()+.08-s.t;ni=Math.ceil(s.t/ST);newRun();mode='play';tr=[];edge=0;
 for(const k of ['menu','res'])$(k).classList.add('h');$('hud').classList.remove('h');$('foot').classList.remove('h')}
function fresh(){score=combo=maxC=perf=good=offc=deaths=0;lvl=0;cpI=0;cpSnap={score:0,combo:0};parts=[];begin(0)}
function die(){mode='dead';deadT=0;deaths++;burst(s.x+.5,s.y+.3,90,9,'#ff4d6d',1.2);burst(s.x+.5,s.y+.3,50,5,'#ffffff');shake=1;flash=.8;glitch=1;
 if(AC&&run){noise(AC.currentTime,.6,.5,300,run.sfx);osc(AC.currentTime,880,.7,'sawtooth',.12,run.sfx,{f2:55,lp:2000});run.bus.gain.setTargetAtTime(0,AC.currentTime+.08,.08)}
 setCombo(0);toast('SIGNAL LOST')}
function win(){mode='win';resT=0;const tot=perf+good+offc,acc=tot?(perf+good*.6)/tot:0,r=acc>=.92&&deaths==0?'S':acc>=.85?'A':acc>=.7?'B':acc>=.5?'C':'D';
 const order='SABCD';if(!best||order.indexOf(r)<order.indexOf(best)){best=r;try{localStorage.synthRank=r}catch(e){}}
 $('rank').textContent=r;$('stats').innerHTML=[['SCORE',String(score).padStart(7,'0')],['ACCURACY',(acc*100).toFixed(1)+'%'],['PERFECT',perf],['GOOD',good],['OFF BEAT',offc],['MAX COMBO',maxC],['SIGNAL LOST',deaths]].map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join('');
 if(run)run.bus.gain.setTargetAtTime(0,AC.currentTime+1.5,.8);setTimeout(()=>{$('res').classList.remove('h');$('hud').classList.add('h');$('foot').classList.add('h')},700)}

 texts.push({x:s.x+.5,y:s.g>0?s.y+1.25:s.y-.65,k,l:1});pluck(k,t);if(k=='PERFECT'){$('combo').style.transform='scale(1.25)';setTimeout(()=>$('combo').style.transform='',90)}}
