<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Synthline</title><meta name="description" content="A one-button neon rhythm runner. One button, one beat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect x='1' y='1' width='8' height='8' fill='%23c6ff3f' stroke='%23ff3fd0'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.45em;pointer-events:none;transition:opacity .35s;padding:0 16px}
#ov h1{margin:0;font-size:clamp(48px,11vw,120px);font-weight:900;font-style:italic;letter-spacing:.04em;background:linear-gradient(180deg,#fff 20%,#ff3fd0 58%,#7a2bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff3fd099) drop-shadow(0 6px 0 #2a0b4a)}
#ov p{margin:0;opacity:.8;letter-spacing:.06em}#bp{color:#c6ff3f;opacity:1!important}
#go{margin-top:1em;font-weight:800;font-size:20px;letter-spacing:.2em;animation:b .94s infinite}@keyframes b{50%{opacity:.35}}
.h{opacity:0}@media (prefers-reduced-motion:reduce){#go{animation:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><h1 id="tt">SYNTHLINE</h1><p id="sub">One button. One beat. Don't blink.</p><p>Click, tap or Space to jump · hold to keep jumping · tap mid-air on yellow rings</p><p id="bp"></p><p id="go">PRESS TO PLAY</p></div>
<script>
//<sim>
const V=8.533,G=95,J=19,PAD=28,CEIL=6,H=1/240;
function build(){const L=[];let cx=14;
 const s=(x,y=0,f=0)=>L.push({t:'s',x:cx+x,y,f}),b=(x,y,w=1,h=1)=>L.push({t:'b',x:cx+x,y,w,h}),pd=x=>L.push({t:'p',x:cx+x,y:0}),
  ob=(x,y)=>L.push({t:'o',x:cx+x,y}),pt=(x,f)=>L.push({t:'g',x:cx+x,f}),sp=(a,n,y=0,f=0)=>{for(let i=0;i<n;i++)s(a+i,y,f)};
 const P={a:()=>(s(0),1),b:()=>(sp(0,2),2),c:()=>(b(0,0,2),sp(2,2),4),d:()=>(b(0,0,2,1),b(2,0,2,2),b(4,0,2,3),s(10),11),
  e:()=>(pd(0),sp(1,3),4),f:()=>(sp(0,4),ob(1.5,1.7),4),g:()=>(b(0,1,6,.5),sp(1,5),6),h:()=>(b(0,1,3,.5),sp(1,4),b(5,1,3,.5),sp(5,3),8),
  i:()=>(pt(0,1),s(5,CEIL-1,1),sp(9,2,CEIL-1,1),s(15,CEIL-1,1),pt(19,0),23),j:()=>(s(0),b(3,0,1,1),s(4),s(8),9),k:()=>(b(0,0,1,1),sp(1,2),3)};
 const seq='a a b a c b d e b a f g e i b h k j f e i c b b h g k f e b a'.split(' ');
 seq.forEach((k,n)=>{cx+=P[k]();cx+=Math.round(8-4*n/seq.length);cx=Math.ceil(cx/2)*2});
 L.sort((p,q)=>p.x-q.x);return{L,end:cx+12}}
function mk(end){return{x:0,y:0,vy:0,g:1,gr:1,u:new Set,i:0,buf:0,end}}
function sub(s,held,edge,L){
 if(edge)s.buf=.1;s.buf-=H;
 if(s.gr&&held){s.vy=J*s.g;s.gr=0;s.buf=0}
 s.vy-=G*s.g*H;const py=s.y;s.x+=V*H;s.y+=s.vy*H;s.gr=0;
 if(s.y<0){s.y=0;s.vy=Math.max(s.vy,0);if(s.g>0)s.gr=1}
 if(s.y>CEIL-1){s.y=CEIL-1;s.vy=Math.min(s.vy,0);if(s.g<0)s.gr=1}
 while(s.i<L.length&&L[s.i].x+(L[s.i].w||1)<s.x-1)s.i++;
 for(let j=s.i;j<L.length&&L[j].x<s.x+1.5;j++){const o=L[j];
  if(o.t=='b'){if(s.x+1>o.x&&s.x<o.x+o.w&&s.y+1>o.y&&s.y<o.y+o.h){
    if(s.g>0&&s.vy<=0&&py>=o.y+o.h-.1){s.y=o.y+o.h;s.vy=0;s.gr=1}
    else if(s.g<0&&s.vy>=0&&py+1<=o.y+.1){s.y=o.y-1;s.vy=0;s.gr=1}
    else{s.dead=1;return}}}
  else if(o.t=='s'){const y0=o.f?o.y+.4:o.y,y1=o.f?o.y+1:o.y+.6;if(s.x+.85>o.x+.3&&s.x+.15<o.x+.7&&s.y+.85>y0&&s.y+.15<y1){s.dead=1;return}}
  else if(s.u.has(j))continue;
  else if(o.t=='p'){if(s.x+1>o.x&&s.x<o.x+1&&s.y<.35&&s.g>0){s.vy=PAD;s.gr=0;s.u.add(j);s.fx='p'}}
  else if(o.t=='o'){if(s.buf>0&&Math.abs(s.x-o.x)<1&&Math.abs(s.y-o.y)<1){s.vy=J*s.g;s.gr=0;s.buf=0;s.u.add(j);s.fx='o'}}
  else if(o.t=='g'){if(s.x+.5>=o.x){s.g=o.f?-1:1;s.vy*=.4;s.gr=0;s.u.add(j);s.fx='g'}}}
 if(s.x>=s.end)s.win=1}
//</sim>
const c=document.getElementById('c'),X=c.getContext('2d'),$=id=>document.getElementById(id),{L,end:END}=build();
let W,Hh,D,U,GY;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;Hh=innerHeight;c.width=W*D;c.height=Hh*D;U=Math.min(Hh/11,W/14);GY=Hh/2+3*U}rs();addEventListener('resize',rs);
const sx=x=>(x-camX)*U,sy=y=>GY-y*U,rnd=(a,b)=>a+Math.random()*(b-a);
let best=0;try{best=+localStorage.synthBest||0}catch(e){}
let s=null,mode='menu',attempts=0,held=0,edge=0,acc=0,rot=0,deadT=0,winT=0,parts=[],trail=[],shake=0,flash=0,camX=0,last=performance.now();
// ---- audio ----
let AC,NB,master,mStart=0,ni=0,mOn=0;const BPM=128,SPB=60/BPM,ST=SPB/4,ROOTS=[45,41,48,43],mf=m=>440*2**((m-69)/12);
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(t,f,d,type,v,f2,lp){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);fl.frequency.exponentialRampToValueAtTime(lp/4,t+d);n=o.connect(fl)}n.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,hp){const b=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();b.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);b.connect(f).connect(g).connect(master);b.start(t);b.stop(t+d)}
function note(i,t){const st=i%16,bar=i>>4,ch=bar%4,r=ROOTS[ch],q=ch?[0,4,7,12]:[0,3,7,12],drop=bar>=16&&bar<18;
 if(st%4==0&&!drop)tone(t,150,.28,'sine',.9,40);
 if((st==4||st==12)&&bar>=2){noise(t,.18,.32,1400);tone(t,210,.1,'triangle',.22,120)}
 if(st%2==1&&bar>=1)noise(t,.05,drop?.05:.11,7000);
 if(st%2==0)tone(t,mf(r-12+(st%4==2?12:0)),ST*1.8,'sawtooth',.2,0,drop?500:1400);
 if(bar>=4)tone(t,mf(r+24+q[[0,1,2,3,2,1,2,3][st%8]]),ST*.9,'square',.045,0,3000);
 if(st==0&&bar>=8)q.slice(0,3).forEach(n=>tone(t,mf(r+12+n),SPB*3,'triangle',.05))}
function startMusic(){if(!AC)return;if(master)master.disconnect();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);mStart=AC.currentTime+.03;ni=0;mOn=1}
function stopMusic(){mOn=0;if(master)master.gain.setTargetAtTime(0,AC.currentTime,.04)}
function sfx(f,d,type,v,f2){if(!AC)return;const m=master;master=AC.createGain();master.gain.value=1;master.connect(AC.destination);tone(AC.currentTime,f,d,type,v,f2);master=m}
// ---- game ----
function burst(x,y,n,sp,col,sz=.25){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:rnd(.4,1),c:col,s:rnd(.06,sz)})}}
function start(){attempts++;s=mk(END);mode='play';acc=0;rot=0;trail=[];parts=[];startMusic();$('ov').classList.add('h')}
function die(){mode='dead';deadT=0;stopMusic();burst(s.x+.5,s.y+.5,70,9,'#c6ff3f',.3);burst(s.x+.5,s.y+.5,40,6,'#ff3fd0');shake=.5;flash=1;
 if(AC){noise(AC.currentTime,.5,.6,200)}const p=Math.floor(s.x/END*100);if(p>best){best=p;try{localStorage.synthBest=best}catch(e){}}}
function win(){mode='win';winT=0;best=100;try{localStorage.synthBest=100}catch(e){}if(master)master.gain.setTargetAtTime(0,AC.currentTime+1,.6);
 for(let i=0;i<6;i++)burst(s.x+rnd(2,12),rnd(1,5),30,7,`hsl(${i*60},100%,65%)`);
 $('tt').textContent='COMPLETE';$('sub').textContent=`Cleared in ${attempts} attempt${attempts>1?'s':''}`;$('go').textContent='PRESS TO PLAY AGAIN';$('bp').textContent='';$('ov').classList.remove('h')}
function down(){if(!AC)initAudio();else if(AC.state=='suspended')AC.resume();held=1;edge=1;if(mode=='menu'||(mode=='win'&&winT>1))start()}
addEventListener('pointerdown',e=>{e.preventDefault();down()});addEventListener('pointerup',()=>held=0);addEventListener('pointercancel',()=>held=0);
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();if(!e.repeat)down()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW','Enter'].includes(e.code))held=0});
addEventListener('blur',()=>held=0);
$('bp').textContent=best?`Best: ${best}%`:'';
function spike(o,col,pulse){const x0=sx(o.x),w=U,yb=sy(o.f?o.y+1:o.y),h=(o.f?1:-1)*U*.92;X.beginPath();X.moveTo(x0+w*.08,yb);X.lineTo(x0+w/2,yb+h);X.lineTo(x0+w*.92,yb);X.closePath();
 X.fillStyle='#0b0614';X.fill();X.shadowColor=col;X.shadowBlur=6+pulse*12;X.strokeStyle='#fff';X.lineWidth=2;X.stroke();X.shadowBlur=0}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 if(mOn&&AC)while(mStart+ni*ST<AC.currentTime+.12){note(ni,mStart+ni*ST);ni++}
 if(mode=='play'){acc+=dt;while(acc>=H){acc-=H;sub(s,held,edge,L);edge=0;
   if(s.fx){const fx=s.fx;s.fx=0;if(fx=='o'){burst(s.x+.5,s.y+.5,20,5,'#ffe14d');sfx(880,.15,'triangle',.15,1320)}else if(fx=='p'){burst(s.x+.5,s.y,20,5,'#ffe14d');sfx(300,.25,'sine',.2,900)}else{flash=.5;sfx(200,.4,'sawtooth',.08,1200)}}
   if(s.dead){die();break}if(s.win){win();break}}
  if(mode=='play'){if(s.gr){const tg=Math.round(rot/(Math.PI/2))*(Math.PI/2);rot+=(tg-rot)*Math.min(1,dt*25);if(Math.random()<.5)parts.push({x:s.x+.1,y:s.g>0?s.y:s.y+1,vx:-rnd(1,3),vy:rnd(0,2)*s.g,l:1,d:.4,c:'#c6ff3f',s:.07})}
   else rot+=dt*7.85*s.g;trail.push([s.x,s.y,rot]);if(trail.length>7)trail.shift()}}
 else if(mode=='dead'){deadT+=dt;if(deadT>.85)start()}else if(mode=='win')winT+=dt;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=12*dt;p.l-=dt/p.d}parts=parts.filter(p=>p.l>0);
 const vw=W/U;if(s&&mode!='menu')camX=s.x-vw*.3+(mode=='win'?0:0);else camX+=dt*V*.5;
 const pct=s?Math.min(1,s.x/END):0,ph=mOn&&AC?Math.max(0,(AC.currentTime-mStart)/SPB)%1:(t/1000/SPB)%1,pulse=(1-ph)**3,hue=(265+((camX/END)*220))%360,acc2=`hsl(${hue},100%,70%)`;
 shake*=.85;flash*=.88;
 // background
 X.setTransform(D,0,0,D,0,0);const g=X.createLinearGradient(0,0,0,Hh);g.addColorStop(0,`hsl(${hue},70%,${11+pulse*5}%)`);g.addColorStop(1,`hsl(${hue+40},80%,3%)`);X.fillStyle=g;X.fillRect(0,0,W,Hh);
 X.translate(rnd(-1,1)*shake*U,rnd(-1,1)*shake*U);
 X.lineWidth=2;for(let i=0;i<16;i++){const sz=(1.5+(i*37%5))*U*(1+pulse*.06),span=W+10*U,px=(((i*5.7-camX*.25)*U)%span+span)%span-5*U,py=((i*53)%9)/9*(GY-U);
  X.save();X.globalAlpha=.1+(i%3)*.03;X.strokeStyle=`hsl(${hue+30+i*7},90%,70%)`;X.translate(px,py);X.rotate(t/4000*(i%2?1:-1)+i);X.strokeRect(-sz/2,-sz/2,sz,sz);X.restore()}
 // ground & ceiling
 X.fillStyle=`hsl(${hue},60%,6%)`;X.fillRect(-U,GY,W+2*U,Hh-GY+U);X.strokeStyle=`hsla(${hue},100%,70%,.18)`;X.beginPath();for(let i=Math.floor(camX);i<camX+vw+1;i++){if(i%2)continue;X.moveTo(sx(i),GY);X.lineTo(sx(i)-U*.8,Hh)}X.stroke();
 const flipped=s&&s.g<0;X.shadowColor=acc2;X.shadowBlur=14;X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.moveTo(-U,GY);X.lineTo(W+U,GY);X.stroke();
 X.globalAlpha=flipped?.9:.15;X.beginPath();X.moveTo(-U,sy(CEIL));X.lineTo(W+U,sy(CEIL));X.stroke();X.globalAlpha=1;X.shadowBlur=0;
 if(flipped){X.fillStyle=`hsla(${hue},60%,6%,.85)`;X.fillRect(-U,-U,W+2*U,sy(CEIL)+U)}
 // attempt label
 if(s){X.font=`900 ${U*.7}px 'Segoe UI',system-ui,sans-serif`;X.fillStyle='rgba(255,255,255,.85)';X.textAlign='left';X.fillText(`ATTEMPT ${attempts}`,sx(3),sy(3.4))}
 // objects
 for(let j=0;j<L.length;j++){const o=L[j];if(o.x>camX+vw+2)break;if(o.x+(o.w||1)<camX-2)continue;const used=s&&s.u.has(j);
  if(o.t=='b'){const x0=sx(o.x),y0=sy(o.y+o.h),w=o.w*U,h=o.h*U;X.fillStyle=`hsla(${hue},70%,10%,.92)`;X.fillRect(x0,y0,w,h);X.shadowColor=acc2;X.shadowBlur=8+pulse*10;X.strokeStyle=acc2;X.lineWidth=2;X.strokeRect(x0,y0,w,h);X.shadowBlur=0;
   X.globalAlpha=.25;X.strokeRect(x0+U*.18,y0+Math.min(U*.18,h*.3),w-U*.36,Math.max(0,h-Math.min(U*.36,h*.6)));X.globalAlpha=1}
  else if(o.t=='s')spike(o,acc2,pulse);
  else if(o.t=='p'){X.shadowColor='#ffe14d';X.shadowBlur=16;X.fillStyle=used?'#a89530':'#ffe14d';X.beginPath();X.ellipse(sx(o.x+.5),sy(0),U*.42,U*.2,0,Math.PI,0);X.fill();X.shadowBlur=0}
  else if(o.t=='o'){const r=U*(.36+pulse*.06);X.globalAlpha=used?.25:1;X.shadowColor='#ffe14d';X.shadowBlur=18;X.strokeStyle='#ffe14d';X.lineWidth=U*.1;X.beginPath();X.arc(sx(o.x+.5),sy(o.y+.5),r,0,7);X.stroke();X.fillStyle='rgba(255,225,77,.25)';X.fill();X.shadowBlur=0;X.globalAlpha=1}
  else if(o.t=='g'){const col=o.f?'#ff3fd0':'#3fe8ff';X.shadowColor=col;X.shadowBlur=24;X.strokeStyle=col;X.lineWidth=U*.16;X.globalAlpha=used?.4:1;X.beginPath();X.ellipse(sx(o.x+.5),sy(CEIL/2),U*.45,CEIL*U*.46,0,0,7);X.stroke();X.globalAlpha=.15;X.fillStyle=col;X.fill();X.globalAlpha=1;X.shadowBlur=0}}
 // player
 if(s&&mode!='dead'){trail.forEach(([x,y,r],i)=>{X.save();X.globalAlpha=i/trail.length*.25;X.translate(sx(x+.5),sy(y+.5));X.rotate(r);X.fillStyle='#c6ff3f';X.fillRect(-U/2,-U/2,U,U);X.restore()});
  X.save();X.translate(sx(s.x+.5),sy(s.y+.5));X.rotate(rot);X.shadowColor='#c6ff3f';X.shadowBlur=20;X.fillStyle='#c6ff3f';X.fillRect(-U/2,-U/2,U,U);X.shadowBlur=0;
  X.strokeStyle='#14240a';X.lineWidth=U*.07;X.strokeRect(-U/2+U*.04,-U/2+U*.04,U*.92,U*.92);X.fillStyle='#3fe8ff';X.fillRect(-U*.22,-U*.22,U*.44,U*.44);X.strokeRect(-U*.22,-U*.22,U*.44,U*.44);X.restore()}
 X.globalCompositeOperation='lighter';for(const p of parts){X.globalAlpha=Math.max(0,p.l);X.fillStyle=p.c;const z=p.s*U;X.fillRect(sx(p.x)-z/2,sy(p.y)-z/2,z,z)}X.globalAlpha=1;X.globalCompositeOperation='source-over';
 X.setTransform(D,0,0,D,0,0);
 if(flash>.01){X.fillStyle=`rgba(255,255,255,${flash*.35})`;X.fillRect(0,0,W,Hh)}
 if(s){const bw=Math.min(360,W*.5),bx=(W-bw)/2,by=18;X.fillStyle='rgba(255,255,255,.15)';X.fillRect(bx,by,bw,8);X.fillStyle='#c6ff3f';X.shadowColor='#c6ff3f';X.shadowBlur=10;X.fillRect(bx,by,bw*pct,8);X.shadowBlur=0;
  X.font="800 14px 'Segoe UI',system-ui,sans-serif";X.textAlign='left';X.fillStyle='#fff';X.fillText(Math.floor(pct*100)+'%',bx+bw+10,by+9)}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
